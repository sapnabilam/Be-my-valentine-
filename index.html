<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine</title>
  <style>
    body {
      background: pink;
      text-align: center;
      font-family: Arial, sans-serif;
      padding-top: 100px;
    }

    h2 {
      font-size: 28px;
    }

    button {
      font-size: 20px;
      padding: 12px 24px;
      margin: 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #yes {
      background: red;
      color: white;
    }

    #no {
      background: white;
      color: black;
    }
  </style>
</head>

<body>

  <h2>Will you be mine Valentine bubu ♾️🫀🌍</h2>

  <button id="yes" onclick="sendYes()">YES</button>
  <button id="no" onclick="growYes()">NO</button>

  <script>
    let yesSize = 20;

    function growYes() {
      yesSize += 10;
      document.getElementById("yes").style.fontSize = yesSize + "px";
    }

    function sendYes() {
      // ⚠️ REPLACE NUMBER BELOW (NO +, NO SPACES)
      const url = "https://api.whatsapp.com/send?phone=919813279342&text=I%20said%20YES%20bubu%20%F0%9F%92%95";
      window.location.href = url;
    }
  </script>

</body>
</html>
